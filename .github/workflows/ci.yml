name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, Tests & Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: "https://placeholder-url.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Run Vitest unit & integration tests
        run: npm run test

      - name: Production build
        run: npm run build

  graph-sync:
    name: Knowledge graph is up to date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install graphify
        run: pip install "graphifyy[sql]==0.9.61"

      - name: Rebuild graph and compare structure
        run: |
          # The report header (date, commit hash) changes on every build, so compare only
          # the structural summary line ("N nodes · M edges · K communities").
          summary() { grep -m1 -E '^- [0-9]+ nodes' "$1"; }
          BEFORE="$(summary graphify-out/GRAPH_REPORT.md)"
          python -m graphify update .
          AFTER="$(summary graphify-out/GRAPH_REPORT.md)"
          echo "committed: $BEFORE"
          echo "rebuilt:   $AFTER"
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "::error::graphify-out/GRAPH_REPORT.md is stale. Run 'npm run graph:update' and commit the result."
            exit 1
          fi
